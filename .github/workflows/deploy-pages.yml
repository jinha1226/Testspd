name: Build and deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_bin="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot_bin"
          "$godot_bin" --version
          printf 'GODOT_BIN=%s\n' "$godot_bin" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp "$RUNNER_TEMP/templates/templates/"* "$template_dir/"

      - name: Import and run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:' "$RUNNER_TEMP/import.log"
          "$GODOT_BIN" --headless --path . --script res://tests/smoke.gd 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -Fq 'SPD port smoke passed' "$RUNNER_TEMP/smoke.log"

      - name: Export web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$GODOT_BIN" --headless --path . --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/export.log"
          ! grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:' "$RUNNER_TEMP/export.log"
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          cp LICENSE.txt ATTRIBUTION.md PORTING.md build/web/
          touch build/web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Godot tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Godot 4.6.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            'https://downloads.godotengine.org/?version=4.6.2&flavor=stable&platform=linux.64&slug=linux.x86_64.zip' \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_bin="$RUNNER_TEMP/godot/Godot_v4.6.2-stable_linux.x86_64"
          chmod +x "$godot_bin"
          "$godot_bin" --version
          printf 'GODOT_BIN=%s\n' "$godot_bin" >> "$GITHUB_ENV"

      - name: Import assets and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' import.log; then
            exit 1
          fi

      - name: Run dungeon smoke tests
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          grep -Fq 'SPD port smoke passed' smoke.log

      - name: Boot main scene
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 8 2>&1 | tee boot.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' boot.log; then
            exit 1
          fi
